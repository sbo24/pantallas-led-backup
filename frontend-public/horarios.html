<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Horarios de las pantallas LED public for Puy du Fou Espana">
    <link rel="stylesheet" href="./css/styles.css?v=1.4">
    <title>Horarios de Espectáculos - Puy du Fou España</title>
</head>

<body>
    <div class="public-display-preview">
        <!-- MAIN CONTENT - 85% de la pantalla -->
        <main class="main-content" id="main-content">
            <!-- Contenido normal: tabla de espectáculos -->
            <div class="shows-container" id="shows-container">
                <table class="shows-table">
                    <thead>
                        <tr>
                            <th class="col-show-combined" colspan="2">
                                <div class="table-title-with-icon">
                                    <img src="./assets/images/shows.png" alt="Shows" class="table-shows-icon">
                                    <span>PRÓXIMOS ESPECTÁCULOS</span>
                                </div>
                            </th>
                            <th class="col-time">Hora</th>
                            <th class="col-status" id="clock-header">14:30</th>
                            <th class="col-next">SIGUIENTE</th>
                        </tr>
                    </thead>
                    <tbody id="shows-tbody">
                        <!-- Los shows se cargarán dinámicamente aquí -->
                    </tbody>
                </table>
            </div>

            <!-- Modo alerta global (oculto por defecto) -->
            <div class="alert-mode" id="alert-mode" style="display: none;">
                <div class="alert-icon">⚠️</div>
                <h1 class="alert-message" id="alert-message">Mensaje de alerta</h1>
                <p class="alert-timestamp" id="alert-timestamp">Activada: 14:30</p>
            </div>
        </main>

        <!-- FOOTER - 15% de la pantalla -->
        <footer class="footer">
            <div class="footer-content">
                <div class="custom-message">
                    <p class="custom-text" id="custom-message-text">Disfruta de los espectáculos de Puy du Fou</p>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="./js/app.js"></script>

</body>

</html>
