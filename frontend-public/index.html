<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pantallas LED Puy du Fou España - Horarios y Diapositivas">
    <title>Pantallas LED - Puy du Fou España</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }

        .display-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        /* Iframe para los horarios */
        .schedule-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.8s ease-in-out;
            opacity: 1;
            z-index: 1;
        }

        /* Capa de diapositivas de imágenes */
        .slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #19140f;
            transition: opacity 0.8s ease-in-out;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
        }

        .slide-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body>
    <div class="display-container">
        <!-- Iframe del Horario de Espectáculos -->
        <iframe 
            id="schedule-frame" 
            class="schedule-iframe" 
            src="./horarios.html" 
            title="Horarios de Espectáculos"
            allow="fullscreen"
        ></iframe>

        <!-- Capa de Imágenes Intercaladas -->
        <div id="slide-layer" class="slide-layer">
            <img id="slide-image" class="slide-image" src="" alt="Diapositiva Programada">
        </div>
    </div>

    <!-- Scripts de configuración y rotación -->
    <script src="./js/config.js"></script>
    <script src="./js/rotator.js?v=1.0"></script>
</body>

</html>
