version: '3.8'
services:
  dev-environment:
    image: ubuntu:22.04
    container_name: showstrack-dev
    restart: unless-stopped
    volumes:
      - showstrack_dev_workspace:/workspace
      - showstrack_dev_repos:/git-repos
      - showstrack_dev_ssh:/root/.ssh
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - DEVELOPMENT_MODE=true
      - SSH_ROOT_PASSWORD=${SSH_ROOT_PASSWORD}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
    ports:
      - "${DEV_SSH_PORT:-222}:22"
      - "8081:8080"
      - "8001:8000"
    networks:
      - showstrack-network
    working_dir: /workspace
    command: >
     bash -c "
      apt update && 
      apt install -y curl wget git openssh-server nano vim htop postgresql-client build-essential sudo &&
      curl -fsSL https://deb.nodesource.com/setup_18.x | bash - &&
      apt install -y nodejs &&
      curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh &&
      apt install -y python3.10 python3.10-venv python3.10-dev python3-pip &&
      update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1 &&
      
      # Crear usuario dev
      useradd -m -s /bin/bash -G sudo,docker dev &&
      echo 'dev:\${SSH_ROOT_PASSWORD}' | chpasswd &&
      
      # Configurar sudo sin password temporal para instalación
      echo 'dev ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
      
      # Configurar workspace para usuario dev
      mkdir -p /home/dev/workspace &&
      chown -R dev:dev /home/dev/workspace &&
      ln -sf /home/dev/workspace /workspace &&
      
      # Instalar Claude Code globalmente como usuario dev
      su - dev -c 'sudo npm install -g @anthropic-ai/claude-code' &&
      
      # Restaurar sudo con password
      sed -i '/dev ALL=(ALL) NOPASSWD: ALL/d' /etc/sudoers &&
      
      # Configurar Python venv como usuario dev
      su - dev -c '
          python3 -m venv /home/dev/workspace/venv &&
          source /home/dev/workspace/venv/bin/activate &&
          pip install --upgrade pip &&
          pip install fastapi uvicorn[standard] sqlalchemy alembic psycopg2-binary asyncpg pydantic pydantic-settings python-jose[cryptography] passlib[bcrypt] pytest pytest-asyncio black mypy isort httpx
      ' &&
      
      # Configurar Git como usuario dev
      su - dev -c '
          git config --global user.name \"\${GIT_USER_NAME}\" &&
          git config --global user.email \"\${GIT_USER_EMAIL}\" &&
          git config --global init.defaultBranch main
      ' &&
      
      # Crear estructura backend como usuario dev
      su - dev -c '
          mkdir -p /home/dev/workspace/showstrack-backend/{app/{api/{v1,admin},core,db,models,schemas,services,utils},tests/{unit,integration},alembic/versions,docker,docs}
      ' &&
      
      # Configurar SSH
      mkdir -p /var/run/sshd &&
      echo 'AllowUsers dev' >> /etc/ssh/sshd_config &&
      echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config &&
      sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin no/' /etc/ssh/sshd_config &&
      service ssh start &&
      
      echo '🚀 ShowsTrack Development Ready with Claude Code' &&
      echo '👤 User: dev' &&
      echo '🔑 SSH: ssh dev@IP -p 222' &&
      echo '🗄️ Database: \${DATABASE_URL}' &&
      echo '📁 Workspace: /home/dev/workspace' &&
      echo '🤖 Claude: claude --help' &&
      tail -f /dev/null
     "

# Volúmenes gestionados
volumes:
  showstrack_dev_workspace:
    driver: local
    name: showstrack_dev_workspace
  showstrack_dev_repos:
    driver: local
    name: showstrack_dev_repos
  showstrack_dev_ssh:
    driver: local
    name: showstrack_dev_ssh

networks:
  showstrack-network:
    external: true
    name: showstrack-network

    # ==========================================
    # 🧪 TESTING Y DEBUGGING
    # ==========================================
    # Test completo del stack:
    #   /opt/showstrack/init-scripts/test_dev_stack.sh
    #
    # Comandos útiles:
    #   docker logs showstrack-dev -f           # Ver logs en tiempo real
    #   docker exec -it showstrack-dev bash     # Entrar al contenedor
    #   ssh dev@$(hostname) -p 222              # SSH como usuario dev
    #
    # Testing interno rápido:
    #   docker exec showstrack-dev python3 --version
    #   docker exec showstrack-dev node --version  
    #   docker exec showstrack-dev claude --version
    #   docker exec showstrack-dev su - dev -c "source /home/dev/workspace/venv/bin/activate && python -c 'import fastapi; print(fastapi.__version__)'"
    #
    # Verificar estructura:
    #   docker exec showstrack-dev ls -la /home/dev/workspace/
    #   docker exec showstrack-dev tree /home/dev/workspace/showstrack-backend/
    #
    # Testing FastAPI:
    #   docker exec -it showstrack-dev su - dev
    #   cd /home/dev/workspace/showstrack-backend
    #   source ../venv/bin/activate
    #   uvicorn app.main:app --host 0.0.0.0 --port 8000
    #   # Luego: curl localhost:8001/docs
    # ==========================================

    # ==========================================
    # 📋 QUICK REFERENCE
    # ==========================================
    # Deploy:     docker-compose up -d
    # Test:       /opt/showstrack/init-scripts/test_dev_stack.sh
    # Logs:       docker logs showstrack-dev -f
    # Shell:      docker exec -it showstrack-dev bash
    # SSH:        ssh dev@$(hostname) -p 222
    # Restart:    docker-compose restart
    # Stop:       docker-compose down
    # ==========================================