# - Entorno preparado para inicio MANUAL con start_showstrack.sh
#
# 🎯 BENEFICIOS:
# - Reinicios súper rápidos (segundos vs minutos)
# - Sin duplicación de scripts
# - Control manual total: start_showstrack.sh
# - Preparado para CI/CD futuro (no autostart hardcodeado)
# - Logs unificados en estructura estándar
