version: '3.8'

services:
  showstrack-dev:
    image: ubuntu:22.04
    container_name: showstrack-dev
    restart: unless-stopped
    
    # VOLÚMENES PERSISTENTES (siguiendo patrón establecido)
    volumes:
      - /c/Users/lmalinge/Documents/Espagne/pantallas-led:/workspace
      - showstrack_dev_home:/home/dev
      - /var/run/docker.sock:/var/run/docker.sock
    
    # RED EXTERNA (misma que postgres y backend)
    networks:
      - showstrack-network
    
    # PUERTOS PARA DESARROLLO LOCAL
    ports:
      - "${DEV_SSH_PORT:-222}:22"       # SSH para acceso remoto
      - "8001:8000"                     # Backend dev (puerto diferente del prod)
      - "3001:3000"                     # Frontend admin dev  
      - "8081:8080"                     # Frontend public dev
    
    # VARIABLES DE ENTORNO (sin Git)
    environment:
      # Core - Base de datos y autenticación
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://showstrack_user:showstrack_36Qz4g_password_2025@showstrack-postgres:5432/showstrack_main}
      - POSTGRES_USER=${POSTGRES_USER:-showstrack_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-showstrack_36Qz4g_password_2025}
      - POSTGRES_DB=${POSTGRES_DB:-showstrack_main}
      - SECRET_KEY=${SECRET_KEY:-dev_secret36Qz4g_key_2025}
      
      # SSH y acceso
      - SSH_ROOT_PASSWORD=${SSH_ROOT_PASSWORD:-showstrack_dev_2025}
      - DEV_SSH_PORT=${DEV_SSH_PORT:-222}
      
      # Desarrollo
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:8080,http://localhost:5173}
    
    # COMANDO DE INICIALIZACIÓN (sin Git)
    command: >
      bash -c "
        # Debug: Mostrar variables cargadas
        echo '🔍 Variables de entorno cargadas:' &&
        env | grep -E '(DATABASE|POSTGRES|SECRET|SSH|DEV|ENVIRONMENT|DEBUG|ALLOWED)' | head -10 &&
        
        # Setup básico del sistema
        apt update && 
        apt install -y curl wget nano vim htop tree openssh-server build-essential &&
        
        # Python 3.10
        apt install -y python3.10 python3.10-venv python3.10-dev python3-pip &&
        update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1 &&
        
        # Node.js 18
        curl -fsSL https://deb.nodesource.com/setup_18.x | bash - &&
        apt install -y nodejs &&
        
        # Claude Code
        npm install -g @anthropic-ai/claude-code &&
        
        # Usuario dev con sudo
        useradd -m -s /bin/bash dev &&
        echo \"dev:\$SSH_ROOT_PASSWORD\" | chpasswd &&
        usermod -aG sudo dev &&
        
        # SSH server
        mkdir -p /var/run/sshd &&
        echo 'AllowUsers dev' >> /etc/ssh/sshd_config &&
        echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config &&
        sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin no/' /etc/ssh/sshd_config &&
        service ssh start &&
        
        # Configurar workspace
        mkdir -p /workspace &&
        chown -R dev:dev /workspace /home/dev &&
        
        # Configurar variables de entorno GLOBALES del sistema
        echo '# ShowsTrack Environment Variables' >> /etc/environment &&
        echo 'DATABASE_URL=\"\$DATABASE_URL\"' >> /etc/environment &&
        echo 'POSTGRES_USER=\"\$POSTGRES_USER\"' >> /etc/environment &&
        echo 'POSTGRES_PASSWORD=\"\$POSTGRES_PASSWORD\"' >> /etc/environment &&
        echo 'POSTGRES_DB=\"\$POSTGRES_DB\"' >> /etc/environment &&
        echo 'SECRET_KEY=\"\$SECRET_KEY\"' >> /etc/environment &&
        echo 'ENVIRONMENT=\"\$ENVIRONMENT\"' >> /etc/environment &&
        echo 'DEBUG=\"\$DEBUG\"' >> /etc/environment &&
        echo 'LOG_LEVEL=\"\$LOG_LEVEL\"' >> /etc/environment &&
        echo 'ALLOWED_ORIGINS=\"\$ALLOWED_ORIGINS\"' >> /etc/environment &&
        
        # Configurar SSH para cargar variables de entorno
        echo 'PermitUserEnvironment yes' >> /etc/ssh/sshd_config &&
        
        # Crear archivo de entorno para usuario dev
        echo '# ShowsTrack Environment Variables' > /home/dev/.env &&
        echo 'export DATABASE_URL=\"\$DATABASE_URL\"' >> /home/dev/.env &&
        echo 'export POSTGRES_USER=\"\$POSTGRES_USER\"' >> /home/dev/.env &&
        echo 'export POSTGRES_PASSWORD=\"\$POSTGRES_PASSWORD\"' >> /home/dev/.env &&
        echo 'export POSTGRES_DB=\"\$POSTGRES_DB\"' >> /home/dev/.env &&
        echo 'export SECRET_KEY=\"\$SECRET_KEY\"' >> /home/dev/.env &&
        echo 'export ENVIRONMENT=\"\$ENVIRONMENT\"' >> /home/dev/.env &&
        echo 'export DEBUG=\"\$DEBUG\"' >> /home/dev/.env &&
        echo 'export LOG_LEVEL=\"\$LOG_LEVEL\"' >> /home/dev/.env &&
        echo 'export ALLOWED_ORIGINS=\"\$ALLOWED_ORIGINS\"' >> /home/dev/.env &&
        
        # Agregar carga automática al .bashrc del usuario dev
        echo '' >> /home/dev/.bashrc &&
        echo '# ShowsTrack Environment Variables' >> /home/dev/.bashrc &&
        echo 'if [ -f ~/.env ]; then' >> /home/dev/.bashrc &&
        echo '    source ~/.env' >> /home/dev/.bashrc &&
        echo 'fi' >> /home/dev/.bashrc &&
        chown dev:dev /home/dev/.env &&
        
        echo '🚀 ShowsTrack Development Environment Ready' &&
        echo '👤 User: dev' &&
        echo '🔑 SSH: ssh dev@YOUR_IP -p \$DEV_SSH_PORT' &&
        echo '📁 Workspace: /workspace' &&
        echo '🤖 Claude Code: claude --help' &&
        echo '📋 Next Steps:' &&
        echo '  1. SSH to container: ssh dev@IP -p \$DEV_SSH_PORT' &&
        echo '  2. Upload/copy code to /workspace' &&
        echo '  3. Backend dev: cd /workspace/backend && python3 -m venv venv && source venv/bin/activate' &&
        echo '  4. Frontend dev: cd /workspace/frontend && npm install' &&
        tail -f /dev/null
      "

# VOLÚMENES NAMED (siguiendo patrón establecido)
volumes:
  showstrack_dev_workspace:
    driver: local
    name: showstrack_dev_workspace
  showstrack_dev_home:
    driver: local
    name: showstrack_dev_home

# RED EXTERNA (igual que backend y postgres)
networks:
  showstrack-network:
    external: true
    name: showstrack-network

# ==========================================
# 📋 INSTRUCCIONES DE USO (SIN GIT)
# ==========================================
# 
# 1. Crear stack en Portainer con este YAML
# 2. Configurar variables de entorno (sin Git)
# 3. Desplegar stack
# 4. SSH al container: ssh dev@IP -p 222
# 5. Subir/copiar código al /workspace:
#    - Via SCP: scp -P 222 -r ./mi-proyecto dev@IP:/workspace/
#    - Via SFTP: sftp -P 222 dev@IP
#    - Via editor remoto (VS Code Remote SSH)
#    - Copiar desde otro container: docker cp source:/path container:/workspace/
# 6. Crear entorno virtual: cd /workspace && python3 -m venv venv
# 7. Activar entorno virtual: source venv/bin/activate
# 8. Instalar dependencias backend: pip install -r requirements.txt
# 9. Ejecutar backend: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
#
# 🚀 INICIO RÁPIDO (después de tener el código):
# ssh dev@IP -p 222
# cd /workspace && source venv/bin/activate
# uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
# 
# 🧪 TESTING DEL ENTORNO:
# ssh dev@IP -p 222
# cd /workspace && source venv/bin/activate
# python -c "import sys; print(f'Python: {sys.version}')"
# node --version
# claude --help
# 
# 🔄 FLUJO DE TRABAJO SIN GIT:
# Desarrollo → Validación → Deploy:
# 1. Desarrollo: cd /workspace && [hacer cambios]
# 2. Validar localmente: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
# 3. Copiar a producción:
#    - Desde dev container: scp -r /workspace/* production-server:/path/
#    - O via docker cp: docker cp showstrack-dev:/workspace/. /local/path/
#    - Luego: docker cp /local/path/. showstrack-backend:/app/
# 4. Reiniciar backend: docker restart showstrack-backend
# 5. Validar en producción: curl http://IP:8000/health
# 
# 📁 MÉTODOS PARA SUBIR CÓDIGO:
# 
# 1. SCP (Secure Copy):
#    scp -P 222 -r ./mi-proyecto dev@IP:/workspace/
# 
# 2. SFTP (SSH File Transfer):
#    sftp -P 222 dev@IP
#    > put -r ./mi-proyecto /workspace/
# 
# 3. VS Code Remote SSH:
#    - Instalar extensión "Remote - SSH"
#    - Conectar a: ssh://dev@IP:222
#    - Abrir carpeta: /workspace
# 
# 4. Desde otro container Docker:
#    docker cp source-container:/source/path/. showstrack-dev:/workspace/
# 
# 5. Via volumen compartido:
#    docker run -v showstrack_dev_workspace:/workspace --rm alpine sh -c "cp -r /source/* /workspace/"
# 
# 🌐 URLs DE ACCESO:
# - Backend DEV: http://IP:8001 (desarrollo)
# - Backend PROD: http://IP:8000 (producción)
# - API Docs DEV: http://IP:8001/docs
# - API Docs PROD: http://IP:8000/docs
# - SSH Dev: ssh dev@IP -p 222
# 
# 📁 ESTRUCTURA SUGERIDA EN /workspace/:
# /workspace/
# ├── backend/                       ← Código Python FastAPI
# │   ├── app/
# │   ├── requirements.txt
# │   └── main.py
# ├── frontend/                      ← Código Vue.js/React
# │   ├── src/
# │   ├── package.json
# │   └── ...
# ├── venv/                          ← Python virtual environment
# ├── scripts/                       ← Scripts útiles
# └── docs/                          ← Documentación
# 
# 🔧 COMANDOS DE DESARROLLO:
# - Backend: cd /workspace/backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
# - Frontend: cd /workspace/frontend && npm install && npm run dev
# - Conecta automáticamente a PostgreSQL del stack existente
# 
# 📚 VENTAJAS SIN GIT:
# - Control total sobre el código fuente
# - No dependencia de servicios externos
# - Flexibilidad para usar cualquier sistema de versiones
# - Posibilidad de trabajar offline
# - Seguridad: código no expuesto en repositorios
# ==========================================