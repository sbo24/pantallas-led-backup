version: '3.8'

services:
  showstrack-backend:
    image: python:3.10-slim
    container_name: showstrack-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    working_dir: /app/showstrack-app/showstrack-backend/backend
    volumes:
      # NAMED VOLUMES - Portainer
      - ../:/app/showstrack-app/showstrack-backend
      - showstrack_backend_logs:/app/logs
      - showstrack_backend_data:/app/data
    command: >
      bash -c "
        # Crear directorios necesarios
        mkdir -p /app/logs /app/data &&
        
        # Instalar herramientas necesarias
        apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/* &&
        
        # Verificar si el código existe
        if [ ! -f /app/showstrack-app/showstrack-backend/backend/app/main.py ]; then
          echo '⚠️  Código backend no encontrado en /app/showstrack-app/showstrack-backend/backend/app/main.py' &&
          echo '📝 Por favor, monte el código en el volumen showstrack_backend_code' &&
          sleep 30 &&
          exit 1
        fi &&
        
        # Navegar al directorio de trabajo correcto
        cd /app/showstrack-app/showstrack-backend/backend &&
        
        # Instalar dependencias Python
        pip install --no-cache-dir -r requirements.txt &&
        
        # Configurar PYTHONPATH para la nueva estructura
        export PYTHONPATH=/app/showstrack-app/showstrack-backend/backend &&
        
        echo '🚀 Iniciando ShowsTrack Backend...' &&
        echo '📁 Working directory: \$(pwd)' &&
        echo '🐍 Python path: \${PYTHONPATH}' &&
        
        # Lanzar aplicación desde el directorio correcto
        uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
      "
    environment:
      # Variables de entorno con valores por defecto
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://showstrack_user:showstrack_36Qz4g_password_2025@showstrack-postgres:5432/showstrack_main}
      - SECRET_KEY=${SECRET_KEY:-dev_secret36Qz4g_key_2025}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app/showstrack-app/showstrack-backend/backend
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      
      # Configuraciones adicionales
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:8080,http://localhost:5173}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CACHE_DEFAULT_TTL=${CACHE_DEFAULT_TTL:-3600}
      - CACHE_API_PUBLIC_TTL=${CACHE_API_PUBLIC_TTL:-300}
      - PUY_DU_FOU_API_BASE_URL=${PUY_DU_FOU_API_BASE_URL:-https://api.mobile.puydufouespana.com}
      - PUY_DU_FOU_API_TIMEOUT=${PUY_DU_FOU_API_TIMEOUT:-10}
      
      # Monitoreo y métricas
      - SENTRY_DSN=${SENTRY_DSN:-}
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - showstrack-network

# NAMED VOLUMES que aparecerán en Portainer
volumes:
  showstrack_backend_logs:
    driver: local  
    name: showstrack_backend_logs
  showstrack_backend_data:
    driver: local
    name: showstrack_backend_data

networks:
  showstrack-network:
    external: true
    name: showstrack-network