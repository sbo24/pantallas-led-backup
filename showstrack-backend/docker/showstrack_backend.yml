# ==========================================
# 📖 MANUAL DE USO - SHOWSTRACK BACKEND
# ==========================================

# 🎯 DESCRIPCIÓN
# --------------
# Stack Docker para ShowsTrack Backend API con FastAPI.
# Incluye sincronización automática con repositorio GitHub,
# instalación automática de dependencias, y configuración
# de desarrollo con auto-reload.

# 🔧 PREREQUISITOS
# ----------------
# 1. Red Docker existente: showstrack-network
# 2. Variables en secrets.env configuradas:
#    - GIT_USERNAME=rvaquerizopdf
#    - GIT_TOKEN=ghp_xxxxxxxxxxxxx (GitHub Personal Access Token)
#    - DATABASE_URL (conexión PostgreSQL)
#    - SECRET_KEY (para JWT)
# 3. Repositorio GitHub: rvaquerizopdf/showstrack-app (privado)
# 4. Código backend en: showstrack-app/showstrack-backend/backend/

# 📋 ESTRUCTURA ESPERADA EN GITHUB
# --------------------------------
# showstrack-app/
# ├── showstrack-backend/
# │   └── backend/                    ← Working directory del contenedor
# │       ├── app/
# │       │   └── main.py            ← FastAPI application
# │       ├── requirements.txt       ← Python dependencies
# │       ├── alembic/               ← Database migrations
# │       └── tests/                 ← Unit tests
# ├── showstrack-frontend/
# ├── showstrack-postgres/
# └── docs/

# 🚀 DEPLOYMENT
# -------------
# 1. Configurar variables en Portainer > Environment:
#    - Ir a Stacks > Environment variables
#    - Cargar secrets.env con variables Git
#
# 2. Deploy stack:
#    - Copiar este YAML en Portainer
#    - Deploy stack
#    - El contenedor clonará automáticamente el código
#
# 3. Verificar funcionamiento:
#    docker logs showstrack-backend -f

# 🔍 TROUBLESHOOTING
# ------------------
# ❌ Error: "fatal: not a git repository"
#    Solución: Limpiar volúmenes en Portainer > Volumes
#             Eliminar: showstrack_backend_code
#             Redeploy stack
#
# ❌ Error: "Repository not found" 
#    Solución: Verificar GIT_TOKEN en secrets.env
#             Token debe tener permisos: repo (full control)
#
# ❌ Error: "No module named 'app'"
#    Solución: Verificar que app/main.py existe en GitHub
#             Estructura debe estar en showstrack-backend/backend/
#
# ❌ Error: "SyntaxError in main.py"
#    Solución: Verificar que main.py tiene formato multi-línea correcto
#             No debe estar todo en una sola línea

# 🔄 OPERACIONES COMUNES
# ----------------------
# Ver logs en tiempo real:
#   docker logs showstrack-backend -f
#
# Entrar al contenedor:
#   docker exec -it showstrack-backend bash
#
# Verificar código sincronizado:
#   docker exec showstrack-backend ls -la /app/showstrack-app/showstrack-backend/backend/
#
# Actualizar código desde GitHub:
#   docker restart showstrack-backend
#
# Probar API:
#   curl http://localhost:8000/health
#   curl http://localhost:8000/docs
#
# Limpiar volúmenes (reset completo):
#   1. Stop stack en Portainer
#   2. Volumes > Delete showstrack_backend_*
#   3. Redeploy stack

# 🌐 URLs DISPONIBLES
# -------------------
# 📡 Backend API: http://localhost:8000
# 📚 Swagger Docs: http://localhost:8000/docs
# 🏥 Health Check: http://localhost:8000/health
# 📊 Redoc: http://localhost:8000/redoc

# 🔧 VARIABLES DE ENTORNO IMPORTANTES
# -----------------------------------
# GIT_USERNAME: Usuario GitHub (rvaquerizopdf)
# GIT_TOKEN: Personal Access Token con permisos repo
# DATABASE_URL: Conexión a PostgreSQL (showstrack-postgres)
# SECRET_KEY: Clave para firmar JWT tokens
# DEBUG: true/false para modo desarrollo
# ENVIRONMENT: development/production

# 📝 DESARROLLO
# -------------
# Para desarrollo local:
# 1. Clonar repo localmente
# 2. Modificar código
# 3. Push a GitHub
# 4. Restart contenedor para sincronizar cambios
#
# Para desarrollo con Claude Code:
# 1. Usar showstrack-dev container
# 2. Modificar código directamente
# 3. Git commit + push desde máquina dev

# ⚡ PERFORMANCE
# -------------
# - Auto-reload activado (--reload)
# - Health checks cada 30s
# - Restart automático si falla
# - Logs en volumen persistente
# - Python bytecode cache deshabilitado para desarrollo <<<< 

# 🔒 SEGURIDAD
# ------------
# - Credenciales Git en environment variables
# - No se exponen tokens en logs
# - Network aislada (showstrack-network)
# - Health checks para monitoreo

# 📈 MONITORING
# -------------
# Health endpoint: /health
# Logs: docker logs showstrack-backend
# Metrics: METRICS_ENABLED=true (opcional)
# Alerts: SENTRY_DSN para error tracking (opcional)

# 🔄 BACKUP Y RECOVERY
# --------------------
# - Código: Respaldado automáticamente en GitHub
# - Logs: Volumen showstrack_backend_logs
# - Data: Volumen showstrack_backend_data
# - Recovery: Redeploy stack (auto-clone desde GitHub)

